name: pillar_flutter_example
description: Flutter example for pillar_flutter — a container exposed to a widget tree.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

# Resolved as part of the workspace declared in the root pubspec:
# one lockfile and one .dart_tool for the whole repo.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pillar_core: ^1.0.0
  pillar_flutter: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
