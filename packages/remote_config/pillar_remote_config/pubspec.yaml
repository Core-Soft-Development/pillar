name: pillar_remote_config
description: Remote configuration for the Pillar framework — the contract for typed feature flags and runtime parameters, with an in-memory implementation.
version: 0.1.0
homepage: https://github.com/Core-Soft-Development/pillar
repository: https://github.com/Core-Soft-Development/pillar
issue_tracker: https://github.com/Core-Soft-Development/pillar/issues

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

# Resolved as part of the workspace declared in the root pubspec:
# one lockfile and one .dart_tool for the whole repo.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.12.0
  # Version constraint, not a path: pub.dev rejects path dependencies.
  # The pub workspace resolves this to the local package.
  pillar_core: ^0.1.0
  # BaseProvider is a ChangeNotifier, so it lives in the Flutter binding rather
  # than in pure-Dart pillar_core.
  pillar_flutter: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: false
