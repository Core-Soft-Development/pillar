name: pillar_remote_config
description: Remote configuration for the Pillar framework — typed feature flags and runtime parameters, backed by Firebase Remote Config.
version: 1.0.0
homepage: https://github.com/Core-Soft-Development/pillar
repository: https://github.com/Core-Soft-Development/pillar
issue_tracker: https://github.com/Core-Soft-Development/pillar/issues

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  firebase_remote_config: ^4.4.0
  flutter:
    sdk: flutter
  meta: ^1.12.0
  # Version constraint, not a path: pub.dev rejects path dependencies.
  # `melos bootstrap` writes the local path into pubspec_overrides.yaml.
  pillar_core: ^1.0.0
  # BaseProvider is a ChangeNotifier, so it lives in the Flutter binding rather
  # than in pure-Dart pillar_core.
  pillar_flutter: ^1.0.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: false
