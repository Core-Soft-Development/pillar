name: PR Checks

# The only workflow that runs on a pull request. ci-cd.yml used to trigger on
# pull_request as well, so every PR ran analyze, test and build twice.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".idea/**"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: Conventional title
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Scopes are deliberately not constrained to a fixed list: the previous
      # one predated half the packages, so a correctly scoped PR was rejected
      # for naming a package that exists.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          disallowScopes: release
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in the pull request title "{title}" should
            not start with an uppercase character.

  verify:
    name: Verify
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # melos compares against the base branch

      - uses: ./.github/actions/setup-melos

      - name: Analyze, format, validate graph, test
        run: melos run ci:verify

      - name: Summarise affected packages
        run: |
          set -euo pipefail
          base="origin/${{ github.event.pull_request.base.ref }}"

          {
            echo "## Packages touched by this PR"
            echo ""
            if melos list --diff "$base" --long 2>/dev/null | grep -q .; then
              echo '```'
              melos list --diff "$base" --long
              echo '```'
              echo ""
              echo "Each will be versioned from its own conventional commits when this lands on main."
            else
              echo "None — no package sources changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release-rehearsal:
    name: Release rehearsal
    # Runs for develop as well as main. The flow is feature -> develop -> main,
    # so restricting this to main would surface a pub.dev rejection one merge
    # later than it needs to be — after the change is already on develop.
    if: github.event.pull_request.draft == false
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-melos

      # Asks pub.dev to validate every package before the merge, rather than
      # discovering a rejection during the release, once tags are in flight.
      - name: Ask pub.dev to validate every package
        run: melos run release:rehearse

      - name: Check the BoM is in sync
        run: melos run bom:verify
