name: pillar

packages:
  - packages/**

repository: https://github.com/Core-Soft-Development/pillar

command:
  bootstrap:
    # Running "pub get" in parallel hits https://github.com/dart-lang/pub/issues/3404.
    # Serialising it makes CI markedly more stable.
    runPubGetInParallel: false
    # Writes the local path: into a generated pubspec_overrides.yaml, so that
    # published pubspecs can carry a version constraint instead. pub.dev
    # rejects path dependencies.
    usePubspecOverrides: true

  clean:
    hooks:
      pre: melos exec -c 1 -- "flutter clean"

  version:
    # Independent versions: each package is bumped from its own conventional
    # commits. The `pillar` BoM is excluded everywhere — its version is
    # calendar-based and regenerated by `bom:sync`.
    updateGitTagRefs: true
    updateChangelogs: true
    linkToCommits: true
    workspaceChangelog: true
    updateDependentsVersionConstraints: true
    updateDependentsConstraints: true
    branch: main
    # melos tags as <package>-v<version>, which is the convention we publish.
    message: |
      chore(release): publish packages

      {new_package_versions}
    includeCommitId: true
    generateChangelog: true

scripts:
  # --- quality ---------------------------------------------------------------

  analyze:
    run: melos exec -c 1 --fail-fast -- dart analyze . --fatal-infos
    description: Run `dart analyze` across every package.

  format:
    run: |
      dart run scripts/dart_files.dart | xargs dart format --line-length=120
    description: Format all hand-written Dart files (120 columns).

  format:check:
    run: |
      dart run scripts/dart_files.dart | xargs dart format --line-length=120 --output=none --set-exit-if-changed
    description: Fail if any file is not formatted. Used by CI.

  test:
    run: melos exec -c 6 --fail-fast --dir-exists="test" -- flutter test
    description: Run tests for every package that has a test directory.

  test:coverage:
    run: melos exec -c 6 --fail-fast --dir-exists="test" -- flutter test --coverage
    description: Run tests with coverage, writing <package>/coverage/lcov.info.

  build_runner:
    run: |
      melos exec -c 1 --fail-fast --depends-on="build_runner" -- \
        dart run build_runner build --delete-conflicting-outputs
    description: Run build_runner in every package that depends on it.

  build_runner:watch:
    run: |
      melos exec -c 1 --fail-fast --depends-on="build_runner" -- \
        dart run build_runner watch --delete-conflicting-outputs
    description: Run build_runner in watch mode.

  build:examples:
    run: melos exec -c 6 --fail-fast --dir-exists="android" -- flutter build apk --debug
    description: |
      Build every example app. Slow (minutes per app) and deliberately kept out
      of the PR path — run it on demand or on a schedule.

  # --- architecture ----------------------------------------------------------

  deps:validate:
    run: dart run scripts/validate_deps.dart
    description: |
      Enforce the package layering rules: core depends on nothing, an interface
      sees only core, an implementation never sees another implementation, no
      cycles, no bare path: dependency, and pub.dev-ready metadata.

  deps:graph:
    run: melos list --graph
    description: Print the dependency graph between packages.

  deps:check:
    run: melos exec -- flutter pub outdated
    description: Check for outdated dependencies in every package.

  deps:upgrade:
    run: |
      melos exec -- flutter pub upgrade
      melos bootstrap
    description: Upgrade dependencies everywhere, then re-bootstrap.

  # --- bill of materials -----------------------------------------------------

  bom:sync:
    run: dart run scripts/bom.dart sync
    description: Regenerate the `pillar` BoM from current package versions.

  bom:verify:
    run: dart run scripts/bom.dart verify
    description: Fail if the BoM has drifted from published package versions.

  # --- versioning ------------------------------------------------------------
  #
  # `melos version` reads conventional commits and bumps each package on its
  # own. There is no lockstep bump: that is what the BoM is for.
  #
  # Note: melos's `--all` means "include private packages", NOT "every
  # package". It is deliberately absent below.

  version:
    run: melos version --yes --ignore="pillar"
    description: |
      Version changed packages from their conventional commits, writing
      changelogs and creating local <package>-v<version> tags. Does not push.

  version:preview:
    run: |
      melos version --yes --ignore="pillar" \
        --no-git-tag-version --no-git-commit-version
      echo ""
      echo "Projected versions (working tree is now dirty — git checkout to undo):"
      melos list --long
    description: Preview what the next release would version, without committing.

  # To bump one package by hand, call melos directly — `melos run` appends its
  # arguments to the command rather than exposing them as $1/$2, so a wrapper
  # here could not validate them and would silently version everything when
  # called with none:
  #
  #   melos version pillar_core minor --yes

  version:prerelease:
    run: melos version --yes --ignore="pillar" --prerelease --preid beta
    description: |
      Cut a beta prerelease (1.2.0-beta.0). --preid takes a prerelease
      identifier such as beta or rc — it is not a bump level.

  version:graduate:
    run: melos version --yes --ignore="pillar" --graduate
    description: Promote prerelease versions to stable.

  # --- publishing ------------------------------------------------------------

  publish:dry-run:
    run: melos publish --yes --ignore="pillar"
    description: |
      Ask pub.dev to validate every package without publishing. This is the
      rehearsal that has to pass before a release writes anything to git.

  publish:
    run: melos publish --no-dry-run --yes --ignore="pillar"
    description: |
      Publish packages to pub.dev in topological order. The BoM is published
      separately, after its pins have been synced to what actually landed.

  publish:bom:
    run: melos publish --no-dry-run --yes --scope="pillar"
    description: Publish the BoM. Runs last — its pins must already exist on pub.dev.

  # --- CI entry points -------------------------------------------------------

  ci:verify:
    run: |
      melos run analyze
      melos run format:check
      melos run deps:validate
      melos run test
    description: Everything a pull request must pass.

  ci:release:
    run: |
      melos run version
      melos run publish:dry-run
      melos run publish
      melos run bom:sync
      melos run publish:bom
    description: |
      The release sequence, in the order that makes it atomic: version locally,
      rehearse against pub.dev, publish, then sync the BoM. Pushing tags is the
      caller's job, and must happen only after this succeeds.
